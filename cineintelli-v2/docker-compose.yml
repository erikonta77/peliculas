# =============================================================================
# CINEINTELLI v2.0 - Docker Compose Stack
# =============================================================================
# Stack completo para producción con Cloudflare Tunnel
# Autor: Arquitectura SaaS
# Versión: 2.0.0
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # CLOUDFLARE TUNNEL - Túnel seguro a internet
  # ===========================================================================
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cineintelli-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - cineintelli-network
    depends_on:
      - nginx
    environment:
      - TUNNEL_METRICS=0.0.0.0:45678
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # NGINX - Reverse Proxy y Static Files
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: cineintelli-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - frontend-build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cineintelli-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # FRONTEND - React SPA (Vite + Build)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: cineintelli-frontend
    volumes:
      - frontend-build:/app/dist
    networks:
      - cineintelli-network
    environment:
      - NODE_ENV=production

  # ===========================================================================
  # BACKEND - FastAPI Application
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineintelli-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./backend/app:/app/app:ro
      - model-data:/app/models
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://cineintelli:${DB_PASSWORD}@postgres:5432/cineintelli
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - cineintelli-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # WORKERS - Celery para tareas en background
  # ===========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: cineintelli-worker
    restart: unless-stopped
    command: celery -app.core.celery worker --loglevel=info --concurrency=4
    volumes:
      - ./backend/app:/app/app:ro
      - model-data:/app/models
    environment:
      - DATABASE_URL=postgresql://cineintelli:${DB_PASSWORD}@postgres:5432/cineintelli
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - C_FORCE_ROOT=true
    depends_on:
      - redis
      - postgres
      - chromadb
    networks:
      - cineintelli-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: cineintelli-scheduler
    restart: unless-stopped
    command: celery -A app.core.celery beat --loglevel=info
    volumes:
      - ./backend/app:/app/app:ro
    environment:
      - DATABASE_URL=postgresql://cineintelli:${DB_PASSWORD}@postgres:5432/cineintelli
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - cineintelli-network

  # ===========================================================================
  # POSTGRESQL - Base de datos principal
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: cineintelli-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cineintelli
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cineintelli
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"  # Solo localhost por seguridad
    networks:
      - cineintelli-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineintelli"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"

  # ===========================================================================
  # REDIS - Cache y Message Broker
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: cineintelli-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Solo localhost por seguridad
    networks:
      - cineintelli-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # CHROMADB - Vector Database para RAG
  # ===========================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: cineintelli-chromadb
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - cineintelli-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# VOLUMES PERSISTENTES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  chroma-data:
    driver: local
  model-data:
    driver: local
  frontend-build:
    driver: local

# =============================================================================
# REDES
# =============================================================================
networks:
  cineintelli-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16